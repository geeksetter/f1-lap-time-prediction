name: Pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    name: Offline mathematical and preparation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src scripts tests
      - run: pytest -q -m 'not integration'
      - run: f1-pipeline --help
  postgres:
    name: PostgreSQL integration checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: f1_ingestion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U f1 -d f1_ingestion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://f1:test_only@localhost:5432/f1_ingestion_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: pytest -q -m integration
